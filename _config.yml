# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone
timezone: Africa/Cairo

# jekyll-seo-tag settings
title: Yosef Mostafa

tagline: Security Research | Red Teaming | Low-Level Internals

description: >-
  In-depth research on Windows Internals, EDR Tradecraft, Reverse Engineering, and Offensive Security.

url: "https://yosefmostef.github.io"

github:
  username: yosefmostef

twitter:
  username: yosefmostef

social:
  name: Yosef Mostafa
  email: yosef.contact@example.com
  links:
    - https://github.com/yosefmostef

# Prefer color scheme setting: dark mode by default
theme_mode: dark

# the avatar on sidebar
avatar: "https://avatars.githubusercontent.com/u/180731391?v=4"

# boolean type, the global switch for TOC in posts.
toc: true

actions:
  edit_post:
    enabled: false

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
